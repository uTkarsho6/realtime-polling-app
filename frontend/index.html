<body class="bg-background font-body-md text-body-md text-on-surface antialiased min-h-screen flex flex-col justify-between">
  <!-- Header -->
  <header class="fixed top-0 left-0 right-0 z-40 bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]">
    <div class="h-14 max-w-[640px] mx-auto px-margin-mobile md:px-margin flex items-center justify-between">
      <a class="font-headline-sm text-headline-sm text-on-surface tracking-tight no-underline hover:text-on-surface-variant transition-colors" href="index.html">PulsePoll</a>
      <nav class="flex items-center">
        <a class="font-label-md transition-colors px-space-sm py-space-xs rounded bg-surface-container text-on-surface" href="index.html">Create poll</a>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="w-full pt-14 flex-1 flex flex-col items-center">
    <div class="w-full max-w-[640px] px-margin-mobile md:px-margin py-space-xl">
      <div class="flex flex-col w-full items-center">
        <div class="w-full max-w-[520px] mx-auto bg-surface-container-lowest p-space-xl rounded-lg shadow-sm border border-outline-variant/30">
          <div class="mb-space-xl">
            <h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight">Create a poll</h1>
            <p class="font-body-md text-body-md text-outline mt-space-xs">Create a question, add your options, and share the live poll.</p>
          </div>
          
          <form class="flex flex-col gap-space-lg" id="createPollForm">
            <!-- Question Field -->
            <div class="flex flex-col gap-space-xs">
              <label class="font-label-lg text-label-lg text-on-surface" for="pollQuestion">Question</label>
              <div class="bg-surface-container-lowest rounded-lg">
                <input class="w-full h-10 px-3 bg-surface-container-lowest text-on-surface placeholder:text-outline font-body-md text-body-md rounded-lg border border-outline-variant/60 focus:outline-none focus:border-primary focus:bg-surface-container-low transition-colors" id="pollQuestion" name="question" placeholder="What would you like to ask?" required type="text"/>
              </div>
            </div>

            <!-- Options Section -->
            <div class="flex flex-col gap-space-xs">
              <label class="font-label-lg text-label-lg text-on-surface">Options</label>
              <div class="flex flex-col gap-space-sm" id="optionsContainer">
                <div class="option-row flex items-center bg-surface-container-low rounded-lg p-space-xs transition-colors focus-within:bg-surface-container">
                  <input class="option-input flex-1 h-9 px-3 bg-transparent text-on-surface placeholder:text-outline font-body-md text-body-md focus:outline-none" placeholder="Option 1" required type="text"/>
                  <button aria-label="Remove option" class="delete-option w-8 h-8 flex items-center justify-center text-outline hover:text-on-surface hover:bg-surface-container-highest rounded transition-colors" type="button">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                      <path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"></path>
                    </svg>
                  </button>
                </div>
                <div class="option-row flex items-center bg-surface-container-low rounded-lg p-space-xs transition-colors focus-within:bg-surface-container">
                  <input class="option-input flex-1 h-9 px-3 bg-transparent text-on-surface placeholder:text-outline font-body-md text-body-md focus:outline-none" placeholder="Option 2" required type="text"/>
                  <button aria-label="Remove option" class="delete-option w-8 h-8 flex items-center justify-center text-outline hover:text-on-surface hover:bg-surface-container-highest rounded transition-colors" type="button">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                      <path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"></path>
                    </svg>
                  </button>
                </div>
              </div>

              <!-- Add Option Button -->
              <div class="pt-space-xs">
                <button class="font-label-lg text-label-lg text-primary hover:text-on-primary-fixed-variant transition-colors py-space-xs px-space-xs flex items-center gap-1.5 focus:outline-none" id="addOptionBtn" type="button">
                  <span class="text-base leading-none font-normal">+</span>
                  <span>Add option</span>
                </button>
              </div>
            </div>

            <!-- Error Banner -->
            <div id="errorBanner" class="hidden text-error bg-error-container text-on-error-container text-body-sm p-3 rounded-lg"></div>

            <!-- Submit Button -->
            <div class="pt-space-sm">
              <button class="w-full h-11 bg-primary text-on-primary font-label-lg text-label-lg rounded-lg hover:bg-primary-container active:opacity-95 transition-all shadow-sm focus:outline-none font-medium flex items-center justify-center" id="submitBtn" type="submit">
                Create poll
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="w-full bg-surface/50 py-space-lg">
    <div class="max-w-[640px] mx-auto px-margin-mobile md:px-margin flex items-center justify-between text-on-surface-variant font-label-sm text-label-sm">
      <span>PulsePoll</span>
      <span class="font-code-md text-code-md text-outline">real-time serverless</span>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="config.js"></script>
  <script>
    (function() {
      const container = document.getElementById('optionsContainer');
      const addBtn = document.getElementById('addOptionBtn');
      const form = document.getElementById('createPollForm');
      const submitBtn = document.getElementById('submitBtn');
      const errorBanner = document.getElementById('errorBanner');

      function showError(msg) {
        errorBanner.textContent = msg;
        errorBanner.classList.remove('hidden');
      }

      function hideError() {
        errorBanner.classList.add('hidden');
      }

      function attachDeleteEvent(button) {
        button.addEventListener('click', function(e) {
          const rows = container.querySelectorAll('.option-row');
          if (rows.length > 2) {
            const row = e.currentTarget.closest('.option-row');
            if (row) row.remove();
          } else {
            const input = e.currentTarget.closest('.option-row').querySelector('.option-input');
            if (input) input.value = '';
          }
        });
      }

      container.querySelectorAll('.delete-option').forEach(attachDeleteEvent);

      addBtn.addEventListener('click', function() {
        const rows = container.querySelectorAll('.option-row');
        if (rows.length >= 6) return;

        const row = document.createElement('div');
        row.className = 'option-row flex items-center bg-surface-container-low rounded-lg p-space-xs transition-colors focus-within:bg-surface-container';
        row.innerHTML = `
          <input 
            type="text" 
            placeholder="Option ${rows.length + 1}"
            class="option-input flex-1 h-9 px-3 bg-transparent text-on-surface placeholder:text-outline font-body-md text-body-md focus:outline-none"
            required
          />
          <button 
            type="button" 
            class="delete-option w-8 h-8 flex items-center justify-center text-outline hover:text-on-surface hover:bg-surface-container-highest rounded transition-colors"
            aria-label="Remove option"
          >
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        `;
        container.appendChild(row);
        attachDeleteEvent(row.querySelector('.delete-option'));
        const input = row.querySelector('.option-input');
        if (input) input.focus();
      });

      // REST API Submit
      form.addEventListener('submit', async function(e) {
        e.preventDefault();
        hideError();

        const question = document.getElementById('pollQuestion').value.trim();
        const optionInputs = container.querySelectorAll('.option-input');
        const options = Array.from(optionInputs)
          .map(input => input.value.trim())
          .filter(val => val.length > 0);

        if (!question) {
          showError('Please enter a poll question.');
          return;
        }
        if (options.length < 2) {
          showError('Please provide at least 2 options.');
          return;
        }

        const unique = new Set(options);
        if (unique.size !== options.length) {
          showError('Duplicate options are not allowed.');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Creating poll...';

        try {
          const res = await fetch(`${CONFIG.REST_API_URL}/polls`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question, options })
          });

          if (!res.ok) {
            throw new Error(`Server returned status ${res.status}`);
          }

          const data = await res.json();
          window.location.href = `poll.html?id=${encodeURIComponent(data.pollId)}`;

        } catch (err) {
          console.error(err);
          showError('Failed to create poll. Please try again.');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create poll';
        }
      });
    })();
  </script>
</body>
</html>
